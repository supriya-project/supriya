version: 2
updates:
- package-ecosystem: github-actions
  cooldown:
    default-days: 7
  directory: /
  groups:
    actions:
      patterns:
      - "*"
  schedule:
    interval: weekly
- package-ecosystem: pip
  cooldown:
    default-days: 7
  directory: /
  schedule:
    interval: weekly
- package-ecosystem: pre-commit
  cooldown:
    default-days: 7
  directory: /
  groups:
    pre-commit:
      patterns:
      - "*"
  schedule:
    interval: weekly
