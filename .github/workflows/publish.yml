name: Publish
on:
  release:
    types: [released]

env:
  PYNPUT_BACKEND: dummy

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build-dist:
    name: Build distribution archives
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        python-version: "3.14"
        enable-cache: false
    - name: Build
      run: uv build --clear --sdist --wheel
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: dist
        path: ./dist

  build-docs:
    name: Build docs
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: $/.github/actions/tune-github-actions
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        python-version: "3.14"
        enable-cache: false
    - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
      with:
        key: ${{ runner.os }}
        restore-keys: ${{ runner.os }}
    - uses: supriya-project/setup-audio@cba59dcc00be5946cd6b59d72cf86342c954a2a1 # v1.0.1
    - uses: supriya-project/setup-supercollider@85a9b85efce9af26b32d30ed8ee293fa65ca675f # v1.1.3
    - name: Install Supriya
      run: uv sync
    - name: Install APT deps
      shell: bash
      run: |
        sudo apt-get update --yes
        sudo apt-get install --yes \
          espeak \
          ffmpeg \
          graphviz \
          lame \
          libasound2-dev
    - name: Build docs
      run: uv run make docs
    - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: ./docs/build/html/

  upload-to-testpypi:
    name: Publish release to Test PyPI
    environment: testpypi
    needs: [build-dist, build-docs]
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        path: ./dist
        pattern: dist
    - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
      with:
        repository-url: https://test.pypi.org/legacy/

  upload-to-pypi:
    name: Publish release to PyPI
    environment: pypi
    needs: [upload-to-testpypi]
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        path: dist
        pattern: dist
    - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  update-gh-pages:
    name: Update gh-pages
    environment:
      name: github-pages
    needs: [upload-to-pypi]
    permissions:
      id-token: write
      pages: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
